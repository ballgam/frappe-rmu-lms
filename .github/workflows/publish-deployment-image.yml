name: Publish RMU LMS deployment image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: publish-rmu-lms-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rmu-somalia/frappe-lms

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}

      - name: Build the smoke-test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: rmu-lms:smoke
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the runtime image
        run: docker run --rm --entrypoint /usr/local/sbin/rmu-lms-smoke-image rmu-lms:smoke

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release and commit tags
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          provenance: mode=max

      - name: Attest the published image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write deployment digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "## RMU LMS image"
            echo
            echo "Release: \`${RELEASE_TAG}\`"
            echo
            echo "Deploy this immutable reference:"
            echo
            echo "\`ghcr.io/rmu-somalia/frappe-lms@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
